version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shiftlk-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shiftlk_db
      MYSQL_USER: shiftlk_user
      MYSQL_PASSWORD: shiftlk_password
    ports:
      - '3306:3306'
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: shiftlk-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://shiftlk_user:shiftlk_password@mysql:3306/shiftlk_db?charset=utf8mb4
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_SECRET: shiftlk_production_jwt_access_secret_key_2026
      JWT_REFRESH_SECRET: shiftlk_production_jwt_refresh_secret_key_2026
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
